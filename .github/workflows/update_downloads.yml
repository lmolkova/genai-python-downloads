name: Update Download Stats and Charts

on:
  schedule:
    # Run weekly at 00:00 UTC on Mondays
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # None needed as the scripts use standard libraries,
          # but we can do any setup if needed in the future.
          python -m pip install --upgrade pip

      - name: Run data collection
        run: python3 scripts/generate_pypi_downloads.py

      - name: Generate charts and update dashboard
        run: python3 scripts/generate_svg_charts.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pypi_downloads.json adoption_charts.md adoption_growth_over_time.svg compare_adoption_across_sources.svg otel_contrib_vs_genai.svg
          # Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update download statistics and charts [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
